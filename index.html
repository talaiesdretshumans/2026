<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8"/>
<title>Talaies pels drets humans 2026</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css">

<style>
html, body { height:100%; margin:0; background:#000; font-family:Arial,sans-serif; }
#map { height:100vh; width:100vw; background:#000; }


.map-title {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  background: rgba(0,0,0,0.7);
  color: #fff;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 18px;
  font-weight: bold;
  text-align: center;
}

.map-subtitle{
  position:absolute; bottom:8px; left:8px;
  color:#ccc; font-size:12px; z-index:1200;
}

/* Panells col·lapsables */
.control-panel{ background:rgba(0,0,0,0.85); border-radius:6px; padding:4px; color:#fff; }
.control-toggle{
  cursor:pointer; text-align:center; font-size:16px; line-height:16px;
  width:24px; height:24px; border-radius:4px; background:#222; color:#fff;
}
.control-content{
  display:none; margin-top:4px; background:rgba(0,0,0,0.9);
  padding:6px; border-radius:4px; font-size:12px;
}
.control-panel.open .control-content{ display:block; }
.control-content select{ width:100%; font-size:12px; }

/* Etiquetes */
.talaia-label, .line-label{ pointer-events:none; }
.talaia-label span{
  color:#000;
  font-size:12px;
  text-shadow:
    -2px 0 #fff, 0 2px #fff, 2px 0 #fff, 0 -2px #fff,
    -2px -2px #fff, 2px -2px #fff, -2px 2px #fff, 2px 2px #fff;
  white-space:nowrap;
}
.line-label span{
  color:#17aeff;
  font-size:12px;
  text-shadow:
    -2px 0 #fff, 0 2px #fff, 2px 0 #fff, 0 -2px #fff,
    -2px -2px #fff, 2px -2px #fff, -2px 2px #fff, 2px 2px #fff;
  white-space:nowrap;
}

/* Llegenda plegable */
.legend{
  background:rgba(0,0,0,0.85);
  padding:10px 12px;
  border-radius:6px;
  font-size:13px;
  color:#fff;
}
.legend-title{ font-weight:bold; margin:6px 0 4px; }
.legend-toggle{
  cursor:pointer; text-align:center; font-weight:bold;
  background:#222; padding:4px 6px; border-radius:4px;
  margin-bottom:8px; user-select:none;
}
.legend.collapsed .legend-content{ display:none; }

.legend-circle{
  display:inline-block;
  width:14px; height:14px;
  border-radius:50%;
  border:3px solid #7a001c; /* granat */
  background: var(--fill);
  margin-right:6px;
  vertical-align:middle;
}
.legend-square{
  display:inline-block;
  width:14px; height:14px;
  border-radius:2px;
  border:1px solid #fff;
  background: var(--fill);
  margin-right:6px;
  vertical-align:middle;
}
.legend-swatch{
  display:inline-block;
  width:14px; height:14px;
  border-radius:2px;
  border:1px solid rgba(255,255,255,0.35);
  background: var(--fill);
  margin-right:6px;
  vertical-align:middle;
}
.legend-line{
  width:20px; height:4px;
  display:inline-block; margin-right:6px;
  border-radius:2px; vertical-align:middle;
}

/* Icona quadrada per Altres punts */
.altres-square-icon{ background:transparent; border:none; }

/* Caixa d'autoria */
.attribution-box{
  position:absolute;
  bottom:8px;
  left:8px;
  background:rgba(0,0,0,0.85);
  color:#fff;
  padding:8px 10px;
  border-radius:6px;
  font-size:12px;
  line-height:1.4;
  z-index:1200;
}
.attribution-box a{
  color:#fff;
  text-decoration:underline;
}


/* Controls foscos (mapes base i cerca) */
.leaflet-control-layers,
.leaflet-control-geocoder {
  background: rgba(0,0,0,0.85) !important;
  color: #fff !important;
  border-radius: 6px;
}

.leaflet-control-layers label,
.leaflet-control-layers span,
.leaflet-control-geocoder a,
.leaflet-control-geocoder-form input {
  color: #fff !important;
}

.leaflet-control-layers-separator {
  border-top: 1px solid #555;
}

.leaflet-control-geocoder-form input {
  background: #111 !important;
  border: 1px solid #444 !important;
}

.leaflet-control-geocoder-icon {
  filter: invert(1);
}

/* Zoom (mateix estil fosc) */
.leaflet-bar{
  border: none !important;
  box-shadow: none !important;
}
.leaflet-bar a{
  background: rgba(0,0,0,0.85) !important;
  color: #fff !important;
  border: 1px solid #444 !important;
}
.leaflet-bar a:hover{
  background: #111 !important;
}
.leaflet-control-zoom a.leaflet-control-zoom-in{
  border-bottom: 1px solid #555 !important;
}


/* Centrar escala gràfica a la part inferior */
.leaflet-bottom.leaflet-left .leaflet-control-scale {
  margin-left: 50vw;
  transform: translateX(-50%);
}


/* Icona de geoposició per al control GPS */
.leaflet-control-locate a {
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.94 3A9.003 9.003 0 0013 3.06V1h-2v2.06A9.003 9.003 0 003.06 11H1v2h2.06A9.003 9.003 0 0011 20.94V23h2v-2.06A9.003 9.003 0 0020.94 13H23v-2h-2.06z"/></svg>');
  background-size: 18px 18px;
  background-repeat: no-repeat;
  background-position: center;
}


/* Etiqueta "GPS" al control de geoposició + parpelleig quan està actiu */
.leaflet-control-locate a {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 10px;
  width: auto;            /* permet text */
  min-width: 34px;        /* manté mida mínima */
}
.leaflet-control-locate .gps-label {
  font: 600 12px/1 Arial, sans-serif;
  color: #fff;
  letter-spacing: 0.3px;
  user-select: none;
}
@keyframes gpsBlink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0.2; }
}
.leaflet-control-locate.gps-active .gps-label {
  animation: gpsBlink 0.9s linear infinite;
}


/* Controls a la part central del costat dret */
.leaflet-top.leaflet-right{
  top: 50% !important;
  transform: translateY(-50%);
}


/* Cercador per nom (capes de punts) */
.name-search{
  background: rgba(0,0,0,0.85) !important;
  color:#fff !important;
  border-radius:6px;
  padding:6px;
}
.name-search .name-search-input{
  width: 190px;
  background:#111;
  color:#fff;
  border:1px solid #444;
  border-radius:4px;
  padding:6px 8px;
  outline:none;
}
.name-search .name-search-input::placeholder{ color:#bbb; }
.name-search .name-search-results{
  margin-top:6px;
  max-height: 260px;
  overflow:auto;
  border:1px solid #333;
  border-radius:4px;
  background: rgba(0,0,0,0.95);
}
.name-search .name-search-item{
  padding:6px 8px;
  cursor:pointer;
  border-bottom:1px solid #222;
}
.name-search .name-search-item:last-child{ border-bottom:none; }
.name-search .name-search-item:hover{ background:#111; }
.name-search .name-search-title{ font-weight:700; }
.name-search .name-search-sub{ font-size:11px; opacity:0.85; margin-top:2px; }


/* Cercador minimitzable */
.name-search .name-search-wrap{
  display:flex;
  align-items:center;
  gap:6px;
}
.name-search .name-search-toggle{
  background:#111;
  color:#fff;
  border:1px solid #444;
  border-radius:4px;
  padding:6px 8px;
  cursor:pointer;
}
.name-search .name-search-toggle:hover{ background:#0b0b0b; }
.name-search .name-search-wrap.collapsed .name-search-input,
.name-search .name-search-wrap.collapsed .name-search-results{
  display:none;
}


/* Icona d'embut per al filtre per territori */
.territori-filter-toggle::before{
  content: "";
  display: inline-block;
  width: 16px;
  height: 16px;
  margin-right: 4px;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M3 4h18l-7 8v6l-4 2v-8L3 4z"/></svg>');
  background-size: contain;
  background-repeat: no-repeat;
  vertical-align: middle;
}




/* Mantén el text/icones visibles sobre el verd */
.leaflet-bar a.tool-active,
.leaflet-control-locate.gps-active a,
.name-search .name-search-wrap:not(.collapsed) .name-search-toggle,
.territori-filter.tool-active button{
  color:#fff !important;
}

/* Efecte hover quan actiu */
.leaflet-bar a.tool-active:hover,
.leaflet-control-locate.gps-active a:hover,
.name-search .name-search-wrap:not(.collapsed) .name-search-toggle:hover,
.territori-filter.tool-active button:hover{
  filter: brightness(0.95);
}


/* Comptador de selecció (filtre per territori) */
.territori-count{
  font: 700 12px/1 Arial, sans-serif;
  margin-left: 4px;
  opacity: 0.95;
}


/* Botó "vista completa" */
.full-extent-control a{
  font-weight: 800;
  font-size: 16px;
  line-height: 26px;
  text-align: center;
}


/* Filtre territori: mostrar text quan està minimitzat */
.territori-filter .territori-filter-toggle{
  display:flex;
  align-items:center;
  gap:6px;
}
.territori-filter.collapsed .territori-filter-toggle::before{
  content: "Filtre";
  font-weight:600;
}

</style>

<body>
<div class="map-title">Talaies pels drets humans 2026</div>
<div class="attribution-box">
  Autor: Llorenç Guasp, 2026<br>
  Agraïments: Josep Lluís Pol, Fons Mallorquí de Solidaritat i
  <a href="https://www.torresitalaies.cat/" target="_blank" rel="noopener">www.torresitalaies.cat</a>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js">
</script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js">
</script>

<script>
// ------------------------------
// Utils
// ------------------------------
function getProp(props, keys){
  for (const k of keys){
    if (!props) continue;
    const v = props[k];
    if (v !== undefined && v !== null && String(v).trim() !== "") return v;
  }
  return "";
}
function boolToSiNo(v){
  if (v === true) return "si";
  if (v === false) return "no";
  const s = String(v).trim().toLowerCase();
  if (s === "true" || s === "1" || s === "sí" || s === "si") return "si";
  if (s === "false" || s === "0" || s === "no") return "no";
  return String(v);
}
function buildPopupHTML(props){
  const nom     = getProp(props, ["nom","Nom","name","Name"]);
  const tipus   = getProp(props, ["Tipus","tipus"]);
  const estat   = getProp(props, ["estat","Estat","estat_conservacio","Estat_conservacio","Estat de conservació","estat de conservació"]);
  const municipi= getProp(props, ["municipi","Municipi"]);
  const horari  = getProp(props, ["horari_encesa","Horari_encesa","horari encesa","Horari encesa"]);
  const link    = getProp(props, ["link","Link","url","URL"]);
  const senyal  = getProp(props, ["senyal","Senyal","info_senyal","info senyal","info senyal"]);
  const img     = getProp(props, ["imatge","Imatge","image","Image"]);

  let html = "";
  if (nom) html += "<b>" + nom + "</b><br>";
  if (tipus) html += "Tipus: " + tipus + "<br>";
  if (estat) html += "Estat de conservació: " + estat + "<br>";
  if (municipi) html += "Municipi: " + municipi + "<br>";
  if (horari) html += "Horari encesa: " + horari + "<br>";

  if (link){
    const u = String(link);
    html += '<a href="' + u + '" target="_blank" rel="noopener">+info</a><br>';
  }

  if (senyal) html += "info senyal: " + senyal + "<br>";

  if (img){
    const u = String(img);
    html += '<div style="margin-top:6px;">' +
            '<a href="' + u + '" target="_blank" rel="noopener">' +
            '<img src="' + u + '" alt="imatge" style="max-width:260px; max-height:180px; display:block; border-radius:4px;">' +
            '</a></div>';
  }

  return html || "<i>Sense informació</i>";
}


// ------------------------------
// Mapa + panes
// ------------------------------
const map = L.map("map").setView([39.7, 3.0], 9);

// Contaminació al fons
const pollutionPane = map.createPane("pollutionPane");
pollutionPane.style.zIndex = 350;

// Línies entre contaminació i punts
const linesPane = map.createPane("linesPane");
linesPane.style.zIndex = 405;

// Altres punts (no participen) / (participen)
const altresNoPane = map.createPane("altresNoPane");  altresNoPane.style.zIndex = 410;
const altresYesPane = map.createPane("altresYesPane"); altresYesPane.style.zIndex = 411;

// Talaies (no participen) / (participen) (a dalt de tot dels punts)
const talaiesNoPane = map.createPane("talaiesNoPane"); talaiesNoPane.style.zIndex = 420;
const talaiesYesPane = map.createPane("talaiesYesPane"); talaiesYesPane.style.zIndex = 421;

// ------------------------------
// Bases
// ------------------------------
const baseDark = L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
  { subdomains: "abcd", maxZoom: 19, attribution: "CARTO Dark | © OpenStreetMap contributors" }
);

const baseDefault = L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  { subdomains: "abcd", maxZoom: 19, attribution: "CARTO | © OpenStreetMap contributors" }
).addTo(map);

const ortoEsri = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  { maxZoom: 19, attribution: "Esri World Imagery" }
);

const relleu = L.tileLayer(
  "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  { subdomains: "abc", maxZoom: 17, attribution: "OpenTopoMap" }
);

// ------------------------------
// Control de capes
// ------------------------------
const liniesOverlay = L.featureGroup(); // es marca quan s'activa
const baseMaps = {
  "Mapa base (CARTO Light)": baseDefault,
  "Mapa base (OSM Dark)": baseDark,
  "Ortofoto (Esri World Imagery)": ortoEsri,
  "Mapa de relleu": relleu
};
const overlays = {
  "Línies de visibilitat": liniesOverlay
};
// Capes actives per defecte
liniesOverlay.addTo(map);
const layerControl = L.control.layers(baseMaps, overlays, { collapsed: true, position: "topright" });

// ------------------------------
// Estils
// ------------------------------
const talaiesOutline = "#7a001c";
const colorsTalaies = {
  "talaies - participen": "#f28c28",   // taronja interior
  "talaies - no participen": "#9e9e9e" // gris interior
};
const colorsAltres = {
  "altres - participen": "#1c6331",
  "altres - no participen": "#6f6f6f"
};
const colorsLinies = {
  "directe": "#17aeff",
  "REVISAR": "#ff4444"
};
function estilLinia(f){
  const t = f.properties ? f.properties.Tipus : null;
  const c = colorsLinies[t] || "#ffffff";
  const dash = t === "REVISAR" ? "6,6" : null;
  return { pane: "linesPane", color: c, weight: 3, opacity: 0.9, dashArray: dash };
}

// ------------------------------
// Estat global
// ------------------------------
let liniesData = null;

let talaiesLayer = null;
let altresLayer = null;
let contaminacioLayer = null;

const labelZoom = 11;
let talaiaLabelMarkers = []; // {label, visible}
let altresLabelMarkers = []; // {label, visible}
let liniaLabelMarkers = [];

let talaiaEntries = []; // {territori, layer, label, visible}
let altresEntries = []; // {territori, layer, visible}
let territorisSet = new Set();

function updateLabelsVisibility(){
  const show = map.getZoom() >= labelZoom;

  talaiaLabelMarkers.forEach(entry => {
    const lbl = entry.label;
    if (!lbl) return;
    if (show && entry.visible && !map.hasLayer(lbl)) lbl.addTo(map);
    if ((!show || !entry.visible) && map.hasLayer(lbl)) map.removeLayer(lbl);
  });

  // Etiquetes Altres punts
  altresLabelMarkers.forEach(entry => {
    const lbl = entry.label;
    if (!lbl) return;
    if (show && entry.visible && !map.hasLayer(lbl)) lbl.addTo(map);
    if ((!show || !entry.visible) && map.hasLayer(lbl)) map.removeLayer(lbl);
  });

  liniaLabelMarkers.forEach(m => {
    if (show && map.hasLayer(liniesOverlay) && !liniesOverlay.hasLayer(m)) liniesOverlay.addLayer(m);
    if ((!show || !map.hasLayer(liniesOverlay)) && liniesOverlay.hasLayer(m)) liniesOverlay.removeLayer(m);
  });
}
map.on("zoomend", updateLabelsVisibility);

function enforceOverlayOrder(){
  // Mantén Talaies per sobre d'Altres punts quan ambdues estan actives
  try { if (altresLayer && map.hasLayer(altresLayer)) altresLayer.bringToBack(); } catch(e) {}
  try { if (talaiesLayer && map.hasLayer(talaiesLayer)) talaiesLayer.bringToFront(); } catch(e) {}
  // Contaminació ja fa bringToBack quan s'afegeix
}
map.on("overlayadd", enforceOverlayOrder);
map.on("overlayremove", enforceOverlayOrder);

// Filtre (multi)
function applyTerritoriFilter(selectedValues){
  const selected = Array.isArray(selectedValues) ? selectedValues.filter(v => v) : [];
  const useAll = selected.length === 0;
  const match = (t) => useAll || selected.includes(t);

  let visibleCount = 0;

  // Talaies
  talaiaEntries.forEach(e => {
    const ok = match(e.territori);
    e.visible = ok;
    if (talaiesLayer){
      if (ok && !talaiesLayer.hasLayer(e.layer)) talaiesLayer.addLayer(e.layer);
      if (!ok && talaiesLayer.hasLayer(e.layer)) talaiesLayer.removeLayer(e.layer);
    }
    if (ok) visibleCount++;
  });

  // Altres punts
  altresEntries.forEach(e => {
    const ok = match(e.territori);
    e.visible = ok;
    if (altresLayer){
      if (ok && !altresLayer.hasLayer(e.layer)) altresLayer.addLayer(e.layer);
      if (!ok && altresLayer.hasLayer(e.layer)) altresLayer.removeLayer(e.layer);
    }
    if (ok) visibleCount++;
  });

  updateLabelsVisibility();

  // UI del filtre: mostrar nombre de punts visibles
  const ctrl = document.querySelector('.territori-filter');
  const countEl = ctrl ? ctrl.querySelector('.territori-count') : null;
  if (countEl){
    countEl.textContent = `(${visibleCount})`;
    countEl.style.display = 'inline';
  }

  // Zoom a la selecció quan hi ha filtre actiu
  if (!useAll){
    const b = L.latLngBounds([]);
    let n = 0;

    if (talaiesLayer) talaiesLayer.eachLayer(l => { if (l.getLatLng){ b.extend(l.getLatLng()); n++; } });
    if (altresLayer)  altresLayer.eachLayer(l => { if (l.getLatLng){ b.extend(l.getLatLng()); n++; } });

    if (b.isValid()){
      if (n === 1){
        map.setView(b.getCenter(), Math.max(map.getZoom(), 12));
      } else {
        map.fitBounds(b, { padding: [30, 30] });
      }
    }
  }
}

// ------------------------------
// Full extent (vista completa)
// ------------------------------
let fullExtentBounds = null;

function computeFullExtentBounds(){
  const b = L.latLngBounds([]);
  let n = 0;
  (talaiaEntries || []).forEach(e => { if (e.layer && e.layer.getLatLng){ b.extend(e.layer.getLatLng()); n++; } });
  (altresEntries || []).forEach(e => { if (e.layer && e.layer.getLatLng){ b.extend(e.layer.getLatLng()); n++; } });
  if (b.isValid() && n > 0) fullExtentBounds = b;
}

function zoomToFullExtent(){
  if (!fullExtentBounds || !fullExtentBounds.isValid()) computeFullExtentBounds();
  if (fullExtentBounds && fullExtentBounds.isValid()){
    map.fitBounds(fullExtentBounds, { padding: [30, 30] });
  }
}

// Botó de control (costat dret)
const FullExtentControl = L.Control.extend({
  options: { position: "topright" },
  onAdd: function(){
    const div = L.DomUtil.create("div", "leaflet-control leaflet-bar full-extent-control");
    const a = L.DomUtil.create("a", "", div);
    a.href = "#";
    a.title = "Vista completa";
    a.innerHTML = "⤢";
    L.DomEvent.on(a, "click", (e) => {
      L.DomEvent.preventDefault(e);
      zoomToFullExtent();
    });
    return div;
  }
});
map.addControl(new FullExtentControl());

// ------------------------------
// Carrega dades (totes)
// ------------------------------
Promise.all([
  fetch("talaies_260124.geojson").then(r => r.json()),
  fetch("altres_punts_260124.geojson").then(r => r.json()),
  fetch("linies_vis_260124.geojson").then(r => r.json()),
  fetch("contaminacio_lum_4326.geojson").then(r => r.json())
]).then(([talaiesJSON, altresJSON, liniesJSON, contamJSON]) => {

  // Línies (només dades, no es pinten fins que cliques)
  liniesData = liniesJSON;

  // Contaminació lumínica (OFF per defecte, sense popups)
  const DN_COLORS = {
    0:"#440154", 5:"#481f70", 7:"#443a82", 16:"#3b528b", 18:"#31688e", 23:"#297c8e",
    170:"#21908d", 230:"#32c563", 235:"#85ea11", 240:"#b7f410", 250:"#e4f803", 255:"#fcd602"
  };
  function styleByDN(f){
    const dn = f.properties ? f.properties.DN : null;
    const c = DN_COLORS[dn] || "#999";
    return { pane:"pollutionPane", color:c, weight:1, opacity:0.7, fillColor:c, fillOpacity:0.7 };
  }
  contaminacioLayer = L.geoJSON(contamJSON, { pane:"pollutionPane", style: styleByDN });
  contaminacioLayer.on("add", () => { try { contaminacioLayer.bringToBack(); } catch(e) {} });
  layerControl.addOverlay(contaminacioLayer, "Contaminació lumínica");

  // Altres punts (ON per defecte)
  altresLayer = L.geoJSON(altresJSON, {
    pointToLayer: (f, latlng) => {
      const s = (f.properties && f.properties.simbologia) || "";
      const c = colorsAltres[s] || "#999";
      const paneName = (s === "altres - participen") ? "altresYesPane" : "altresNoPane";
      const size = 6.5;
      return L.marker(latlng, {
        pane: paneName,
        icon: L.divIcon({
          className: "altres-square-icon",
          html: '<div style="width:'+size+'px;height:'+size+'px;background:'+c+';border:1px solid #fff;border-radius:2px;"></div>',
          iconSize: [size, size],
          iconAnchor: [size/2, size/2]
        })
      }).addTo(map);
    },
    onEachFeature: (f, lyr) => {
      const props = f.properties || {};
      lyr.bindPopup(buildPopupHTML(props), { maxWidth: 340 });

      const territori = getProp(props, ["Territori","territori"]) || "Altres";
      
      // etiqueta (mateixa configuració que Talaies)
      const nomLbl = getProp(props, ["nom","Nom","name","Name"]);
      let lbl = null;
      if (nomLbl){
        lbl = L.marker(lyr.getLatLng(), {
          icon: L.divIcon({
            className: "talaia-label",
            html: "<span>" + nomLbl + "</span>",
            iconSize: [0,0],
            iconAnchor: [0, -14]
          })
        });
        altresLabelMarkers.push({ label: lbl, visible: true });
      }

      territorisSet.add(territori);
      altresEntries.push({ territori: territori, layer: lyr, visible: true });
    }
  });
  layerControl.addOverlay(altresLayer, "Altres punts");

  // Talaies (ON per defecte) + etiquetes + click per línies
  talaiesLayer = L.geoJSON(talaiesJSON, {
    pointToLayer: (f, latlng) => {
      const s = (f.properties && f.properties.simbologia) || "";
      const c = colorsTalaies[s] || "#999";
      const paneName = (s === "talaies - participen") ? "talaiesYesPane" : "talaiesNoPane";
      return L.circleMarker(latlng, {
        pane: paneName,
        radius: 3.5,
        fillColor: c,
        color: talaiesOutline,
        weight: 3,
        opacity: 1,
        fillOpacity: 0.95
      });
    },
    onEachFeature: (f, lyr) => {
      const props = f.properties || {};
      lyr.bindPopup(buildPopupHTML(props), { maxWidth: 340 });

      // etiqueta
      const nom = getProp(props, ["nom","Nom","name","Name"]);
      const territori = getProp(props, ["Territori","territori"]) || "Altres";
      let lbl = null;
      if (nom){
        lbl = L.marker(lyr.getLatLng(), {
          icon: L.divIcon({
            className: "talaia-label",
            html: "<span>" + nom + "</span>",
            iconSize: [0,0],
            iconAnchor: [0, -14]
          })
        });
        talaiaLabelMarkers.push({ label: lbl, visible: true });
      }

      territorisSet.add(territori);
      talaiaEntries.push({ territori: territori, layer: lyr, label: lbl, visible: true });

      // click -> línies que toquen la talaia
      lyr.on("click", () => {
        if (!liniesData) return;

        const pt = turf.point([lyr.getLatLng().lng, lyr.getLatLng().lat]);
        liniesOverlay.clearLayers();
        liniaLabelMarkers = [];

        const seleccionades = (liniesData.features || []).filter(ft => turf.booleanPointOnLine(pt, ft));
        if (!seleccionades.length){ updateLabelsVisibility(); return; }

        const liniesGeo = L.geoJSON({ type:"FeatureCollection", features: seleccionades }, { style: estilLinia });
        liniesOverlay.addLayer(liniesGeo);

        // etiquetes distància
        seleccionades.forEach(ft => {
          const dist = ft.properties ? ft.properties.distancia_km : null;
          if (dist === undefined || dist === null || dist === "") return;
          const center = turf.center(ft).geometry.coordinates; // [lng,lat]
          const lblL = L.marker([center[1], center[0]], {
            icon: L.divIcon({
              className: "line-label",
              html: "<span>" + dist + " km</span>",
              iconSize: [0,0],
              iconAnchor: [0,0]
            })
          });
          liniaLabelMarkers.push(lblL);
        });

        if (!map.hasLayer(liniesOverlay)) liniesOverlay.addTo(map);
        

updateLabelsVisibility();
        enforceOverlayOrder();
      });
    }
  }).addTo(map);

const NameSearchControl = L.Control.extend({
  options: { position: "topright" },
  onAdd: function () {
    const container = L.DomUtil.create("div", "leaflet-control leaflet-bar name-search territori-filter");
    container.innerHTML = `
      <div class="name-search-wrap collapsed">
        <button class="name-search-toggle" type="button" title="Cercar per talaia">🔎</button>
        <input class="name-search-input" type="text" placeholder="Cercar per talaia..." />
        <div class="name-search-results" style="display:none;"></div>
      </div>
`;

    L.DomEvent.disableClickPropagation(container);
    L.DomEvent.disableScrollPropagation(container);

    const input = container.querySelector(".name-search-input");
    const resultsDiv = container.querySelector(".name-search-results");

    
    const wrap = container.querySelector(".name-search-wrap");
    const toggleBtn = container.querySelector(".name-search-toggle");

    function setCollapsed(collapsed){
      wrap.classList.toggle("collapsed", !!collapsed);
      if (collapsed){
        resultsDiv.style.display = "none";
      } else {
        // focus input when expanding
        setTimeout(() => input.focus(), 0);
      }
    }

    // Start minimized
    setCollapsed(true);

    toggleBtn.addEventListener("click", () => {
      const isCollapsed = wrap.classList.contains("collapsed");
      setCollapsed(!isCollapsed);
    });

function collectMatches(q){
      const matches = [];
      const query = q.trim().toLowerCase();
      if (!query) return matches;

      function addFromLayer(layer, layerLabel){
        if (!layer) return;
        layer.eachLayer(l => {
          const p = (l.feature && l.feature.properties) ? l.feature.properties : {};
          const name = (p.nom ?? "").toString();
          if (!name) return;
          if (name.toLowerCase().includes(query)) {
            // latlng: marker or circleMarker
            const latlng = (l.getLatLng) ? l.getLatLng() : null;
            if (latlng) matches.push({ name, layerLabel, latlng, leafletLayer: l });
          }
        });
      }

      addFromLayer(talaiesLayer, "Talaies");
      addFromLayer(altresLayer, "Altres punts");

      // Ordena per coincidència més "forta"
      matches.sort((a,b) => a.name.localeCompare(b.name, "ca"));
      return matches.slice(0, 12);
    }

    function renderResults(matches){
      if (!matches.length){
        resultsDiv.style.display = "none";
        resultsDiv.innerHTML = "";
        return;
      }
      resultsDiv.style.display = "block";
      resultsDiv.innerHTML = matches.map((m, i) =>
        `<div class="name-search-item" data-idx="${i}">
          <div class="name-search-title">${escapeHtml(m.name)}</div>
          <div class="name-search-sub">${escapeHtml(m.layerLabel)}</div>
        </div>`
      ).join("");

      // click
      resultsDiv.querySelectorAll(".name-search-item").forEach(el => {
        el.addEventListener("click", () => {
          const idx = Number(el.getAttribute("data-idx"));
          const m = matches[idx];
          if (!m) return;
          // apropa i obre popup
          map.setView(m.latlng, Math.max(map.getZoom(), 13));
          if (m.leafletLayer && m.leafletLayer.openPopup) m.leafletLayer.openPopup();
          resultsDiv.style.display = "none";
        });
      });
    }

    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, s => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[s]));
    }

    let lastQuery = "";
    

    // Auto-expandeix quan l'usuari comença a escriure (per si està plegat)
    input.addEventListener("focus", () => setCollapsed(false));

input.addEventListener("input", () => {
      const q = input.value;
      if (q === lastQuery) return;
      lastQuery = q;
      const matches = collectMatches(q);
      renderResults(matches);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const matches = collectMatches(input.value);
        if (matches.length) {
          // primer resultat
          const m = matches[0];
          map.setView(m.latlng, Math.max(map.getZoom(), 13));
          if (m.leafletLayer && m.leafletLayer.openPopup) m.leafletLayer.openPopup();
        }
        resultsDiv.style.display = "none";
      } else if (e.key === "Escape") {
        resultsDiv.style.display = "none";
      }
    });

    return container;
  }
});
map.addControl(new NameSearchControl());

// ------------------------------
// Mesura
// ------------------------------
let measuring = false;
let measurePoints = [];
let measureLine = null;
let measureLabel = null;
let measureMarkers = [];

function clearMeasurement(){
  measurePoints = [];
  if (measureLine){ map.removeLayer(measureLine); measureLine = null; }
  if (measureLabel){ map.removeLayer(measureLabel); measureLabel = null; }
  measureMarkers.forEach(m => map.removeLayer(m));
  measureMarkers = [];
}

map.on("click", function(e){
  if (!measuring) return;
  const latlng = e.latlng;

  if (measurePoints.length === 0){
    measurePoints.push(latlng);
    measureMarkers.push(L.circleMarker(latlng,{radius:4,color:"#fff",weight:1,fillColor:"#000",fillOpacity:1}).addTo(map));
  } else if (measurePoints.length === 1){
    measurePoints.push(latlng);
    measureMarkers.push(L.circleMarker(latlng,{radius:4,color:"#fff",weight:1,fillColor:"#000",fillOpacity:1}).addTo(map));

    if (measureLine) map.removeLayer(measureLine);
    measureLine = L.polyline([measurePoints[0], measurePoints[1]], {color:"#00ffff", weight:2, dashArray:"4,4"}).addTo(map);

    const from = turf.point([measurePoints[0].lng, measurePoints[0].lat]);
    const to = turf.point([measurePoints[1].lng, measurePoints[1].lat]);
    const distKm = turf.distance(from, to, {units:"kilometers"});
    const distM = distKm * 1000;

    const mid = L.latLng((measurePoints[0].lat+measurePoints[1].lat)/2, (measurePoints[0].lng+measurePoints[1].lng)/2);
    if (measureLabel) map.removeLayer(measureLabel);
    measureLabel = L.marker(mid, {
      icon: L.divIcon({ className:"line-label", html:"<span>"+distM.toFixed(0)+" m</span>", iconSize:[0,0], iconAnchor:[0,0] })
    }).addTo(map);
  } else {
    clearMeasurement();
    measurePoints.push(latlng);
    measureMarkers.push(L.circleMarker(latlng,{radius:4,color:"#fff",weight:1,fillColor:"#000",fillOpacity:1}).addTo(map));
  }
});

const MeasureControl = L.Control.extend({
  options: { position: "topleft" },
  onAdd: function(){
    const div = L.DomUtil.create("div", "leaflet-control control-panel");
    div.innerHTML = '<div class="control-toggle" title="Mesurar distància">📏</div>' +
                    '<div class="control-content"><b>Mesura</b><br>' +
                    "<small>Fes dos clics al mapa per mesurar.<br>Torna a clicar per començar de nou.</small></div>";
    L.DomEvent.disableClickPropagation(div);
    const toggle = div.querySelector(".control-toggle");
    toggle.onclick = (e) => {
      L.DomEvent.stopPropagation(e);
      L.DomEvent.preventDefault(e);
      div.classList.toggle("open");
      measuring = !measuring;
      if (!measuring) clearMeasurement();
    };
    return div;
  }
});
map.addControl(new MeasureControl());
